version: 2

project_name: hybridrouter

builds:
  - id: hybridrouter
    main: ./cmd/hybridrouter
    binary: hybridrouter
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: default
    builds:
      - hybridrouter
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

brews:
  - name: hybridrouter
    repository:
      owner: Lore-Hex
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/Lore-Hex/HybridRouter
    description: Hybrid local and cloud LLM router with Claude Code backup
    license: Elastic-2.0
    install: |
      bin.install "hybridrouter"
    test: |
      system "#{bin}/hybridrouter", "-version"

changelog:
  use: github
