version: 2

project_name: allrouter

builds:
  - id: allrouter
    main: ./cmd/allrouter
    binary: allrouter
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: default
    builds:
      - allrouter
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

brews:
  - name: allrouter
    repository:
      owner: Lore-Hex
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/Lore-Hex/AllRouter
    description: Local and cloud LLM routing with Claude Code backup
    license: Elastic-2.0
    install: |
      bin.install "allrouter"
    test: |
      system "#{bin}/allrouter", "-version"

changelog:
  use: github
